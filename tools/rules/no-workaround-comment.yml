id: no-workaround-comment
language: Tsx
severity: error
message: >-
  Комментарий-оправдание (workaround, hack, temporary, TODO, FIXME) не заменяет
  исправление и устаревает быстрее кода.
note: >-
  Устрани первопричину. Если ограничение действительно нужно, закрепи его типом,
  тестом или строкой в README, а не комментарием.
rule:
  kind: comment
  regex: '(?i)(\b(workaround|hack|temporary|todo|fixme)\b|костыл|временн)'
