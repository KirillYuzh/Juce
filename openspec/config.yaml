schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: juce-ui — React 19 UI kit (primitives, AI patterns, blocks, pages) with Storybook 10.
  Layers: src/lib -> src/data -> src/components/ui -> src/components/ai -> src/components/blocks -> src/sections -> src/pages; imports are enforced by eslint-plugin-boundaries.
  Quality gates: npm run check (typecheck, eslint, ast-grep, rule fixtures, tests with a ratchet baseline), npm run gen:themes -- --check, npm run lint:css, npm run check:pack, npm run spec:validate.
  Theming has two independent axes: data-theme picks colour roles (--tb-* colour tokens and color-scheme), data-skin picks shape (radius and shadow roles). Theme and skin blocks live in src/styles/tokens.css, src/styles/skins.css and the generated src/styles/themes.css; palettes come from scripts/gen-themes.mjs, and components never branch on a theme name.
  One engine per problem: TanStack for tables and virtualization; floating layers are being consolidated on Base UI.
  Specs describe observable behavior, never internal class or function names.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
