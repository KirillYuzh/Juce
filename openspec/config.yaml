schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: juce-ui — React 19 UI kit (primitives, AI patterns, blocks, pages) with Storybook 10.
  Layers: src/lib -> src/data -> src/components/ui -> src/components/ai -> src/components/prebuilt -> src/components/blocks -> src/pages; imports are enforced by eslint-plugin-boundaries.
  Quality gates: npm run check (typecheck, eslint, ast-grep, rule fixtures, CSS checks for hover, theme branching, radii, motion tokens and the single reduced-motion guard, tests with a ratchet baseline, pack check and openspec validation).
  Theming: data-theme picks colour roles (--tb-* colour tokens and color-scheme). Theme blocks live in src/styles/tokens.css and src/styles/themes-presets.css, structural roles (radius, fonts, motion) in src/styles/structure.css, motion guard in src/styles/motion.css. Themes are hand-written; components never branch on a theme name; there is no second axis for shape.
  One engine per problem: TanStack for tables and virtualization; floating layers are being consolidated on Base UI.
  Specs describe observable behavior, never internal class or function names.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
